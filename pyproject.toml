[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football_rl"
version = "0.1.0"
description = "4v4 Multi-Agent Reinforcement Learning Continuous 2D Football Environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "pygame>=2.5.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
